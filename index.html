<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Overseas Trip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="frontend/js/tailwind.config.js"></script>
    <link rel="stylesheet" href="frontend/css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body
    class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-gray-100 h-[100dvh] w-full flex flex-col overflow-hidden selection:bg-primary selection:text-white"
  >
    <div id="devModeBar" class="hidden-force"></div>
    <div
      id="toast"
      class="fixed top-12 left-1/2 transform -translate-x-1/2 bg-gray-800 dark:bg-gray-100 text-white dark:text-gray-900 px-4 py-2 rounded-lg shadow-2xl z-[100] transition-opacity duration-300 opacity-0 pointer-events-none text-sm font-bold border-2 border-gray-700 dark:border-gray-200"
    ></div>
    <div
      id="viewLoading"
      class="fixed inset-0 z-50 flex justify-center items-center bg-gray-100 dark:bg-gray-950"
    >
      <div class="loader w-10 h-10"></div>
    </div>

    <div
      id="unauthLayout"
      class="flex-1 flex flex-col w-full relative overflow-y-auto"
    >
      <header
        class="flex items-center justify-between px-5 py-1 border-b-2 border-gray-200 dark:border-gray-800 shrink-0 bg-white dark:bg-gray-900 shadow-md"
      >
        <div class="flex flex-col">
          <h1
            class="font-black text-xl text-primary tracking-tight leading-tight"
          >
            Overseas Trip
          </h1>
          <span
            id="unauthTripName"
            class="text-xs font-bold text-gray-500 uppercase tracking-wider hidden-force"
          ></span>
        </div>
        <div class="flex gap-1.5">
          <button
            onclick="updateApp(this)"
            class="relative p-2 rounded-lg text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 transition focus:outline-none"
          >
            <svg
              class="w-5 h-5 transition-transform duration-500 active:rotate-180 btn-icon"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
              ></path>
            </svg>
            <div
              class="btn-spinner spinner-primary dark:spinner-white hidden-force !w-4 !h-4 border-2 absolute inset-0 m-auto"
            ></div>
          </button>
          <button
            onclick="toggleTheme()"
            class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 transition focus:outline-none"
          >
            🌗
          </button>
        </div>
      </header>

      <main
        id="unauthMain"
        class="flex-1 flex flex-col p-4 w-full max-w-lg mx-auto pb-20 relative"
      >
        <div id="viewLanding" class="mt-10 space-y-4 w-full animate-slide-up">
          <div class="text-center mb-6">
            <h2
              class="text-3xl font-extrabold mb-2 text-gray-900 dark:text-white"
            >
              Welcome
            </h2>
            <p class="text-gray-500 dark:text-gray-400 font-medium">
              Please select an option below.
            </p>
          </div>


          <div
            id="landingRegBox"
            class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-md border-2 border-gray-200 dark:border-gray-700 text-center border-t-4 border-t-green-500 hidden-force"
          >
            <h3 class="text-xl font-bold mb-1 text-gray-900 dark:text-white">
              Join the Trip
            </h3>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-5">
              Registration is currently open.
            </p>
            <button
              onclick="navigateTo('register.html')"
              class="w-full bg-green-600 text-white py-3 rounded-xl font-bold text-lg hover:bg-green-700 shadow-md transition"
            >
              Register Now
            </button>
          </div>
          <div
            id="viewLogin"
            class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-md border-2 border-gray-200 dark:border-gray-700 w-full animate-slide-up"
          >
            <div
              class="flex justify-between items-center mb-6 border-b-2 border-gray-100 dark:border-gray-800 pb-4"
            >
              <h2
                class="text-xl font-black text-gray-900 dark:text-white tracking-tight"
              >
                Secure Login
              </h2>
            </div>
            <div
              id="loginError"
              class="bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-400 p-3 rounded-lg text-sm mb-4 font-bold hidden-force border-2 border-red-200 dark:border-red-800"
            ></div>
            <div class="mb-8 text-left">
              <div class="flex flex-col mb-1.5">
                <label
                  class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                  >Password</label
                >
                <span class="text-sm text-gray-500 dark:text-gray-400 mt-0.5"
                  >NRIC/FIN or Passport No. + Year of Birth (e.g.
                  <strong class="font-mono text-gray-700 dark:text-gray-300"
                    >S1234567A1989</strong
                  >
                  or
                  <strong class="font-mono text-gray-700 dark:text-gray-300"
                    >E12345671989</strong
                  >)</span
                >
              </div>
              <div class="relative">
                <input
                  type="password"
                  id="loginPass"
                  class="w-full p-3 border-2 border-gray-300 dark:border-gray-700 rounded-xl pr-12 font-bold text-gray-900 dark:text-white bg-gray-50 dark:bg-gray-900 focus:border-primary focus:ring-2 focus:ring-primary/20 transition outline-none"
                  placeholder="e.g. S1234567A1989 / E12345671989"
                  onkeypress="
                    handleEnter(event, () =>
                      attemptLogin(document.getElementById('loginSubmitBtn')),
                    )
                  "
                />
                <button
                  type="button"
                  onclick="togglePassword('loginPass')"
                  class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-gray-400 hover:text-primary transition focus:outline-none"
                >
                  <svg
                    id="eyeOpen"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    class="w-5 h-5"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                    />
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    />
                  </svg>
                  <svg
                    id="eyeClosed"
                    class="hidden-force"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    class="w-5 h-5"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                    />
                  </svg>
                </button>
              </div>
            </div>
            <button
              id="loginSubmitBtn"
              onclick="attemptLogin(this)"
              class="w-full bg-primary text-white py-3.5 rounded-xl font-bold text-lg hover:bg-green-600 transition flex justify-center items-center shadow-lg focus:outline-none"
            >
              <span class="btn-text">Login</span>
              <div class="btn-spinner spinner-white hidden-force ml-2"></div>
            </button>
          </div>

          <!-- Subtle Upload Receipt Section -->
          <div
            id="landingReceiptBox"
            class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700/80 w-full transition-all mt-4 overflow-hidden"
          >
            <button
              type="button"
              onclick="toggleLandingReceipt()"
              class="w-full flex justify-between items-center p-3.5 text-left focus:outline-none hover:bg-gray-50/80 dark:hover:bg-gray-750 transition group cursor-pointer"
            >
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="p-1.5 rounded-lg bg-gray-100 dark:bg-gray-700/60 text-gray-500 dark:text-gray-400 group-hover:text-primary transition-colors shrink-0">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                  </svg>
                </span>
                <div class="min-w-0">
                  <h3 class="text-xs font-bold text-gray-700 dark:text-gray-200 group-hover:text-gray-900 dark:group-hover:text-white transition-colors truncate">
                    Upload Receipt
                  </h3>
                  <p class="text-[11px] text-gray-400 dark:text-gray-500 truncate">Need to submit a reimbursement claim without logging in?</p>
                </div>
              </div>
              <svg
                id="receiptExpandIcon"
                class="w-4 h-4 text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300 transition-transform duration-300 shrink-0 ml-2"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.5"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </button>
            <div
              id="landingReceiptFormWrapper"
              class="hidden-force p-4 border-t border-gray-100 dark:border-gray-700/80 text-left bg-gray-50/40 dark:bg-gray-800/40"
            >
              <p
                class="text-xs text-gray-500 dark:text-gray-400 mb-4 font-bold"
              >
                Please fill in the details of the receipt.
              </p>
              <div
                id="landingReceiptError"
                class="bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-400 p-3 rounded-lg text-sm mb-4 font-bold hidden-force border-2 border-red-200 dark:border-red-800"
              ></div>
              <div
                id="landingReceiptSuccess"
                class="bg-green-50 text-green-600 dark:bg-green-900/30 dark:text-green-400 p-3 rounded-lg text-sm mb-4 font-bold hidden-force border-2 border-green-200 dark:border-green-800"
              ></div>
              <form
                id="landingReceiptForm"
                onsubmit="submitLandingReceipt(event)"
                class="flex flex-col gap-4"
              >
                <div>
                  <label
                    class="block text-xs font-bold mb-1 text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                    >Uploader NRIC</label
                  >
                  <input
                    type="text"
                    id="landingRecNric"
                    required
                    oninput="
                      if (
                        typeof isValidNRIC === 'function' &&
                        isValidNRIC(this.value)
                      ) {
                        document
                          .getElementById('landingReceiptError')
                          .classList.add('hidden-force');
                      }
                    "
                    class="w-full p-2.5 border-2 border-gray-300 dark:border-gray-700 rounded-xl uppercase font-bold bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-purple-500/20"
                    placeholder="S1234567A"
                  />
                </div>
                <div>
                  <label
                    class="block text-xs font-bold mb-1 text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                    >Name (Optional)</label
                  >
                  <input
                    type="text"
                    id="landingRecName"
                    class="w-full p-2.5 border-2 border-gray-300 dark:border-gray-700 rounded-xl font-bold bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-purple-500/20"
                    placeholder="John Doe"
                  />
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label
                      class="block text-xs font-bold mb-1 text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                      >Currency</label
                    >
                    <select
                      id="landingRecCurrency"
                      onchange="landingCurChange()"
                      required
                      class="w-full p-2.5 border-2 border-gray-300 dark:border-gray-700 rounded-xl font-bold bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-purple-500/20"
                    >
                      <option value="SGD" selected>SGD</option>
                      <option value="MYR">MYR</option>
                      <option value="USD">USD</option>
                      <option value="EUR">EUR</option>
                      <option value="GBP">GBP</option>
                      <option value="AUD">AUD</option>
                      <option value="IDR">IDR</option>
                      <option value="THB">THB</option>
                      <option value="JPY">JPY</option>
                      <option value="KRW">KRW</option>
                    </select>
                  </div>
                  <div>
                    <label
                      class="block text-xs font-bold mb-1 text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                      >Amount</label
                    >
                    <input
                      type="number"
                      step="0.01"
                      id="landingRecAmount"
                      oninput="landingCalcSgd()"
                      required
                      class="w-full p-2.5 border-2 border-gray-300 dark:border-gray-700 rounded-xl font-bold bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-purple-500/20 text-right"
                      placeholder="0.00"
                    />
                  </div>
                </div>

                <div
                  id="landingReceiptBidirectionalRate"
                  class="hidden-force flex flex-col gap-2 p-2.5 border-2 border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900/50"
                >
                  <label
                    class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider border-b-2 border-gray-200 dark:border-gray-700 pb-1 mb-1"
                    >Exchange Rate</label
                  >
                  <div class="flex items-center justify-between">
                    <div class="font-black text-xs text-gray-500 w-12 shrink-0">
                      1 <span id="landingRecCurLabel1">MYR</span>
                    </div>
                    <div class="font-bold text-xs text-gray-400 px-1 shrink-0">
                      =
                    </div>
                    <div class="flex-1 min-w-0 pr-2">
                      <input
                        type="number"
                        step="0.01"
                        id="landingRecRateToSgd"
                        placeholder="0.00"
                        oninput="
                          handleLandingRateInputSync('to_sgd', this.value)
                        "
                        class="w-full text-sm font-bold p-1.5 border-2 border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-950 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 text-gray-900 dark:text-white transition shadow-md placeholder-gray-400 text-right"
                      />
                    </div>
                    <div
                      class="font-black text-xs text-gray-500 w-10 shrink-0 text-right"
                    >
                      SGD
                    </div>
                  </div>
                  <div class="flex items-center justify-between">
                    <div class="font-black text-xs text-gray-500 w-12 shrink-0">
                      1 SGD
                    </div>
                    <div class="font-bold text-xs text-gray-400 px-1 shrink-0">
                      =
                    </div>
                    <div class="flex-1 min-w-0 pr-2">
                      <input
                        type="number"
                        step="0.01"
                        id="landingRecRateFromSgd"
                        placeholder="0.00"
                        oninput="
                          handleLandingRateInputSync('from_sgd', this.value)
                        "
                        class="w-full text-sm font-bold p-1.5 border-2 border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-950 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 text-gray-900 dark:text-white transition shadow-md placeholder-gray-400 text-right"
                      />
                    </div>
                    <div
                      class="font-black text-xs text-gray-500 w-10 shrink-0 text-right"
                    >
                      <span id="landingRecCurLabel2">MYR</span>
                    </div>
                  </div>
                  <input type="hidden" id="landingRecRate" value="1" />
                </div>

                <div>
                  <label
                    class="block text-xs font-bold mb-1 text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                    >SGD Equiv</label
                  >
                  <input
                    type="number"
                    step="0.01"
                    id="landingRecSgd"
                    readonly
                    class="w-full p-2.5 border-2 border-gray-200 dark:border-gray-700 rounded-xl font-bold bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400 text-right"
                    placeholder="0.00"
                  />
                </div>
                <div>
                  <label
                    class="block text-xs font-bold mb-1 text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                    >Category</label
                  >
                  <select
                    id="landingRecCategory"
                    required
                    class="w-full p-2.5 border-2 border-gray-300 dark:border-gray-700 rounded-xl font-bold bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-purple-500/20"
                  >
                    <option value="" disabled selected>
                      Loading categories...
                    </option>
                  </select>
                </div>
                <div>
                  <label
                    class="block text-xs font-bold mb-1 text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                    >Receipt File</label
                  >
                  <input
                    type="file"
                    id="landingRecFile"
                    required
                    accept="image/*,.pdf"
                    class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-gray-100 file:text-gray-700 dark:file:bg-gray-700 dark:file:text-gray-200 hover:file:bg-gray-200 dark:hover:file:bg-gray-600"
                  />
                </div>
                <div>
                  <label
                    class="block text-xs font-bold mb-1 text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                    >Remarks (Optional)</label
                  >
                  <input
                    type="text"
                    id="landingRecRemarks"
                    class="w-full p-2.5 border-2 border-gray-300 dark:border-gray-700 rounded-xl font-bold bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-purple-500/20"
                    placeholder="Details..."
                  />
                </div>
                <button
                  type="submit"
                  id="landingRecBtn"
                  class="w-full bg-primary hover:bg-green-700 text-white py-2.5 rounded-xl font-bold text-sm transition flex justify-center items-center shadow-sm focus:outline-none mt-2"
                >
                  <span class="btn-text">Submit Receipt</span>
                  <div
                    class="btn-spinner spinner-white hidden-force ml-2"
                  ></div>
                </button>
              </form>
            </div>
          </div>

          <!-- Trip Infographic Image Card (At Bottom of Landing Page) -->
          <div
            id="landingInfographicBox"
            class="hidden-force bg-white dark:bg-gray-800 rounded-3xl shadow-md border-2 border-gray-200 dark:border-gray-700 overflow-hidden w-full transition-all animate-slide-up mt-6"
          >
            <div class="px-5 py-3 bg-gradient-to-r from-gray-50 to-indigo-50/40 dark:from-gray-900 dark:to-indigo-950/20 border-b-2 border-gray-100 dark:border-gray-800 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="p-1 rounded-lg bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                  </svg>
                </span>
                <span id="landingInfographicTitle" class="text-xs font-black text-gray-800 dark:text-gray-200 uppercase tracking-wider">Trip Infographic</span>
              </div>
              <a
                id="landingInfographicFullLink"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="text-xs font-bold text-primary dark:text-green-400 hover:underline flex items-center gap-1"
                title="Open in Google Drive"
              >
                <span>Open Full</span>
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
              </a>
            </div>
            <div class="p-3 bg-gray-50/50 dark:bg-gray-900/40 flex justify-center items-center">
              <img
                id="landingInfographicImg"
                src=""
                alt="Trip Infographic"
                class="w-full h-auto max-h-[550px] object-contain rounded-2xl shadow-sm hover:opacity-95 transition cursor-pointer"
                onclick="openInfographicModal(this.src)"
              />
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="backend/config.js"></script>
    <script src="frontend/js/api.js"></script>
    <script src="frontend/js/state.js"></script>
    <script src="frontend/js/ui.js"></script>
    <script src="frontend/js/main.js"></script>
    <script src="frontend/js/auth.js"></script>
    <script>
      function openInfographicModal(src) {
        if (!src) return;
        let modal = document.getElementById("infographicModal");
        if (!modal) {
          modal = document.createElement("div");
          modal.id = "infographicModal";
          modal.className = "fixed inset-0 bg-black/80 z-[200] flex flex-col justify-center items-center p-3 backdrop-blur-md";
          modal.innerHTML = `
            <div class="relative max-w-4xl max-h-[90vh] flex flex-col items-center">
              <button onclick="document.getElementById('infographicModal').classList.add('hidden-force')" class="absolute -top-10 right-0 text-white hover:text-gray-300 text-3xl font-black px-2 focus:outline-none cursor-pointer">&times;</button>
              <img id="infographicModalImg" src="" alt="Infographic" class="max-h-[85vh] max-w-full object-contain rounded-xl shadow-2xl" />
            </div>
          `;
          modal.addEventListener("click", (e) => {
            if (e.target === modal || e.target.tagName === 'BUTTON') {
              modal.classList.add("hidden-force");
            }
          });
          document.body.appendChild(modal);
        }
        document.getElementById("infographicModalImg").src = src;
        modal.classList.remove("hidden-force");
      }

      window.initPage = () => {
        if (currentUser) {
          if (currentUser.role === "admin") navigateTo("roster.html");
          else navigateTo("dashboard.html");
          return;
        }
        if (typeof renderLandingInfographic === "function") {
          renderLandingInfographic();
        }
      };
    </script>
  </body>
</html>
