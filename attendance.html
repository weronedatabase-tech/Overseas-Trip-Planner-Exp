<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Attendance - MYG Overseas Trip</title>
<link rel="manifest" href="manifest.json">
<!-- [CONSIDERATION - UI/UX]: Tailwind config ensures Black-based Dark Mode -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="frontend/js/tailwind.config.js"></script>
<link rel="stylesheet" href="frontend/css/styles.css">
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen w-full flex flex-col overflow-y-auto overflow-x-hidden selection:bg-primary selection:text-white transition-colors duration-200 pb-safe">

<div id="app-header"></div>

<main id="tab-attendance" class="flex-1 w-full max-w-5xl mx-auto flex flex-col relative h-[calc(100vh-64px)] min-h-[500px]">
    <!-- Attendance UI injected here -->
</main>

<!-- Core Scripts -->
<script src="backend/config.js"></script>
<script src="frontend/js/core.js"></script>
<script src="frontend/js/ui.js"></script>
<script src="frontend/js/attendance.js"></script>

<script>
// [CONSIDERATION - HYDRATION & ISOLATION]: Initialize page-specific logic 
document.addEventListener('DOMContentLoaded', async () => {
    AppCore.renderHeader("Attendance");
    
    // We need global logistics for the attendance list
    if (!window.globalLogistics) {
        try {
            window.globalLogistics = await AppCore.apiFetch('fetchLogistics');
            if (typeof processDisplayNames === "function") processDisplayNames(window.globalLogistics.participants);
            if (typeof applyGlobalSorting === "function") window.globalLogistics.participants = applyGlobalSorting(window.globalLogistics.participants);
        } catch (e) {
            AppCore.showToast("Failed to load participant data.", true);
        }
    }
    
    buildAttendanceUI();
    await renderAttendanceChecklist();
});
</script>
</body>
</html>
