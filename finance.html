<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finance - MYG Overseas Trip</title>
<link rel="manifest" href="manifest.json">
<!-- [CONSIDERATION - UI/UX]: Tailwind config ensures Black-based Dark Mode -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="frontend/js/tailwind.config.js"></script>
<link rel="stylesheet" href="frontend/css/styles.css">
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen w-full flex flex-col overflow-y-auto overflow-x-hidden selection:bg-primary selection:text-white transition-colors duration-200 pb-safe">

<div id="app-header"></div>

<main id="tab-finance" class="flex-1 w-full max-w-6xl mx-auto flex flex-col relative h-[calc(100vh-64px)] min-h-[500px]">
    <!-- Finance UI injected here -->
</main>

<!-- Core Scripts -->
<script src="backend/config.js"></script>
<script src="frontend/js/core.js"></script>
<script src="frontend/js/finance.js"></script>

<script>
// [CONSIDERATION - HYDRATION & ISOLATION]
document.addEventListener('DOMContentLoaded', async () => {
    AppCore.renderHeader("Finance");
    
    if (!window.globalLogistics) {
        try {
            window.globalLogistics = await AppCore.apiFetch('fetchLogistics');
        } catch(e) { }
    }
    
    await buildFinanceUI();
});
</script>
</body>
</html>
