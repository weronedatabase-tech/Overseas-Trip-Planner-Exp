name: Deploy Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Configure Clasp Credentials
        run: |
          if (!process.env.CLASPRC_JSON_SECRET) {
            console.error("Error: CLASPRC_JSON_SECRET is not set.");
            process.exit(1);
          }
          const parsed = JSON.parse(process.env.CLASPRC_JSON_SECRET);
          require('fs').writeFileSync(require('os').homedir() + '/.clasprc.json', JSON.stringify(parsed));
        shell: node {0}
        env:
          CLASPRC_JSON_SECRET: ${{ secrets.CLASPRC_JSON_SECRET }}

      - name: Push to Apps Script
        run: |
          cd backend
          clasp push --force
